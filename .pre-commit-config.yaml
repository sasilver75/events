# Pre-commit hooks: auto-format Go and Swift before each commit.
# Setup: `brew install pre-commit && pre-commit install`. See README.md
# "Local development". Mirrors scripts/claude-format.sh dispatch logic.

repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: goimports
        name: goimports
        entry: goimports -w
        language: system
        types: [go]

      - id: golangci-lint
        name: golangci-lint
        entry: sh -c 'cd server && golangci-lint run ./...'
        language: system
        files: ^server/.*\.go$
        pass_filenames: false

      - id: swift-format
        name: swift-format
        entry: swift-format format -i
        language: system
        types: [swift]
